[project]
name = "backend"
version = "0.1.0"
description = "Hoops Log backend: shot-chart API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.148.0",
    "sqlmodel>=0.0.48",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "FAST"]

[tool.ruff.lint.per-file-ignores]
# Written by the breaker agent: odd characters and dense asserts are the point.
"tests/adversarial/*" = ["PT006", "PT018", "RUF001"]
