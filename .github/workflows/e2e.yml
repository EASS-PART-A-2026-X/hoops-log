name: e2e
# Browser tests: a real Chromium drives the real frontend against the real backend (see frontend/README.md).
#
#   pull request          the FAST set (smoke, API, the log journey, one short monkey): a few minutes, so it can gate a merge
#   push to frontend/main the FULL suite (everything, all monkey seeds): about 20 minutes, runs after the merge
#   every night, by hand  the FULL suite as well (a schedule only runs from the default branch)
#
# Separate from ci.yml so a slow browser never hides the fast checks, and so it can be re-run on its own.
on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [frontend, main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      # The fast set on pull requests, everything otherwise.
      SUITE: ${{ github.event_name == 'pull_request' && 'e2e:fast' || 'e2e' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Remember the browser between runs
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx --prefix frontend playwright install --with-deps chromium
        if: steps.browser.outputs.cache-hit != 'true'
      - run: npx --prefix frontend playwright install-deps chromium
        if: steps.browser.outputs.cache-hit == 'true'
      - run: npm --prefix frontend run "$SUITE"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
